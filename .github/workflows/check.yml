name: Check

on:
  push:
    branches: [main]
    paths-ignore:
      - "src/**"
      - "public/**"
      - "envs/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".tool-versions"
      - ".github/workflows/deploy.yml"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Astro / ESLint / Prettier
        run: npm run check
      - name: Stylelint
        run: npm run check:stylelint
      - name: Spell check
        run: npm run check:spell
      - name: Unit tests
        run: npm test
